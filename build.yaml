# This file generates the GitHub Actions matrix
# For simple board + shield combinations, add them
# to the top level board and shield arrays, for more
# control, add individual board + shield combinations to
# the `include` property, e.g:
#
# board: [ "nice_nano_v2" ]
# shield: [ "corne_left", "corne_right" ]
# include:
#   - board: bdn9_rev2
#   - board: nice_nano_v2
#     shield: reviung41
#
---
include:
  - board: nice_nano@2.0.0//zmk
    shield: charybdis_left
  - board: nice_nano@2.0.0//zmk
    shield: charybdis_right
    artifact-name: charybdis-right-badjeff-pinned
  - board: nice_nano@2.0.0//zmk
    shield: charybdis_right
    artifact-name: charybdis-right-official-invert-xy-no-swap-pinned
    cmake-args: >-
      -DEXTRA_CONF_FILE=${GITHUB_WORKSPACE}/config/pmw3610_official.conf
      -DEXTRA_DTC_OVERLAY_FILE=${GITHUB_WORKSPACE}/config/pmw3610_official.overlay
  - board: nice_nano@2.0.0//zmk
    shield: charybdis_right
    artifact-name: charybdis-right-official-invert-xy-no-swap-smart-off-pinned
    cmake-args: >-
      -DEXTRA_CONF_FILE=${GITHUB_WORKSPACE}/config/pmw3610_official.conf
      -DEXTRA_DTC_OVERLAY_FILE=${GITHUB_WORKSPACE}/config/pmw3610_official_no_smart.overlay
  - board: nice_nano@2.0.0//zmk
    shield: settings_reset
